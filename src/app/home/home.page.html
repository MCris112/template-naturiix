<main class="relative w-full h-screen bg-center bg-cover" style="background-image: url('/assets/images/bg_home.jpg');">
    <div class="absolute top-0 left-0 bg-black w-full h-full opacity-60"></div>
    <div class="relative z-2 container pt-40">
        <div class="w-full">
            <div class="flex flex-col gap-3"> 
                <figure class="mb-6 w-[300px] max-w-3/4 mx-auto">
                    <img class="w-full" src="/logo.png" alt="Logo template Figure">
                </figure>

                <p class="text-justify mb-3 text-white">Ofrecemos productos especializados para el cuidado de tu cuerpo que se merece lo mejor.</p>

                <form class="hidden md:flex border-2 border-accent">
                    <input type="text" class="text-accent">
                    <button class="w-10 h-10 bg-accent text-white"><i class='bx bx-search-alt-2' ></i></button>
                </form>

                <div class="flex w-full">
                    <button class="btn btn-accent basis-1/2">
                        Ver Productos
                    </button>

                    <button class="btn btn-accent-outline basis-1/2">
                        Acerca de nosotros
                    </button>
                </div>
            </div>

            <div class="text-white py-6">
                <style>
    swiper-container::part(wrapper) {
      transition-timing-function: linear !important;
    }
  </style>
            <swiper-container init="false" swiper [config]="config">
                @for (item of products; track $index) {
                    <swiper-slide>
                        <img [src]="item">
                    </swiper-slide>
                }
            </swiper-container>
            </div>

            <div class="text-white py-6">
                <style>
    swiper-container::part(wrapper) {
      transition-timing-function: linear !important;
    }
  </style>
            <swiper-container init="false" swiper [config]="config2">
                @for (item of products2; track $index) {
                    <swiper-slide>
                        <img [src]="item">
                    </swiper-slide>
                }
            </swiper-container>
            </div>  
        </div>
    </div>
</main>



<app-header />
